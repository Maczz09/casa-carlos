[package]
name = "hospedaje-carlos-desktop"
version = "1.1.0"
description = "Aplicación de escritorio para recepción y kiosco de Hospedaje Carlos"
authors = ["Hospedaje Carlos"]
license = "UNLICENSED"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "HospedajeCarlos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
fs2 = "0.4.3"
tauri = { version = "2.11.5", features = [] }
url = "2.5.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
