<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospedaje Carlos</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #f5f7fa;
        color: #0f2d4b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% 20%, rgba(14, 116, 144, .12), transparent 34rem),
          radial-gradient(circle at 85% 80%, rgba(217, 164, 65, .12), transparent 30rem),
          #f5f7fa;
      }

      main {
        width: min(34rem, calc(100vw - 3rem));
        text-align: center;
        animation: enter .55s cubic-bezier(.2,.8,.2,1) both;
      }

      .mark {
        width: 5.25rem;
        height: 5.25rem;
        margin: 0 auto 1.3rem;
        border-radius: 1.6rem;
        display: grid;
        place-items: center;
        background: #0f2d4b;
        color: white;
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -.08em;
        box-shadow: 0 1.4rem 3rem rgba(15, 45, 75, .22);
        position: relative;
      }

      .mark::after {
        content: "";
        position: absolute;
        width: 1.6rem;
        height: 1.6rem;
        border-radius: 999px;
        right: -.35rem;
        top: -.35rem;
        background: #d9a441;
        border: .28rem solid #f5f7fa;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 2.8rem);
        line-height: 1.05;
        letter-spacing: -.045em;
      }

      .mode {
        margin: .7rem 0 1.8rem;
        color: #0e7490;
        font-size: .75rem;
        font-weight: 800;
        letter-spacing: .17em;
      }

      .status {
        min-height: 3.5rem;
        color: #526277;
        font-size: 1rem;
        line-height: 1.6;
      }

      .loader {
        width: 2.2rem;
        height: 2.2rem;
        margin: 1rem auto 0;
        border: .22rem solid rgba(15, 45, 75, .12);
        border-top-color: #0e7490;
        border-radius: 999px;
        animation: spin .8s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes enter {
        from { opacity: 0; transform: translateY(1rem) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">HC</div>
      <h1>Hospedaje Carlos</h1>
      <p class="mode" id="mode">APLICACIÓN DE ESCRITORIO</p>
      <p class="status" id="status">Iniciando los servicios del hotel…</p>
      <div class="loader" aria-label="Cargando"></div>
    </main>
    <script>
      window.setDesktopMode = (mode) => {
        document.getElementById("mode").textContent = mode;
      };
      window.setStartupStatus = (message) => {
        document.getElementById("status").textContent = message;
      };
    </script>
  </body>
</html>
